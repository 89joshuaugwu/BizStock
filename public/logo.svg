<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <!-- Isometric Box Top Face -->
  <polygon points="100,40 170,80 100,120 30,80" fill="#7C3AED" opacity="0.8" />
  
  <!-- Isometric Box Left Face -->
  <polygon points="30,80 100,120 100,190 30,150" fill="#7C3AED" />
  
  <!-- Isometric Box Right Face -->
  <polygon points="100,120 170,80 170,150 100,190" fill="#6D28D9" />

  <!-- Success Indicator / Growth Trend -->
  <path 
    d="M 60,100 L 95,135 L 155,55" 
    stroke="#16A34A" 
    stroke-width="14" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
  />
</svg>
